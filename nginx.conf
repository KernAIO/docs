server {
  listen 80;
  # The stock 10-listen-on-ipv6-by-default.sh only patches nginx's own default.conf, and this
  # file replaces it — so without this line nginx is IPv4-only and anything resolving localhost
  # to ::1 first (busybox wget, for one) is refused.
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri $uri/ $uri/index.html /404.html; }
}
